name: Build pause menu support

on:
  push:
    branches:
      - build/pause-menu-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all loaders
        run: bash gradlew build --no-daemon

      - name: Collect release jars
        run: |
          mkdir -p dist
          find fabric quilt forge neoforge -path "*/build/libs/*.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: SmoothMenuReloaded-26.2-pause-menu
          path: dist/*.jar
          if-no-files-found: error
